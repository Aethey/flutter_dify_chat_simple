name: chat_bot_sdk
description: A Flutter SDK for integrating with Dify.ai Chat API, supporting streaming responses
version: 0.0.1
homepage: https://github.com/yourusername/chat_bot_sdk

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  dio: ^5.11.1
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  freezed_annotation: ^3.1.0
  flutter_riverpod: ^3.4.3
  flutter_markdown_plus: ^1.0.12
  uuid: ^4.6.0
  intl: ^0.20.3
  cached_network_image: ^4.0.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  record: ^6.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  http_parser: ^4.1.2
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
  freezed: ^4.0.1

flutter:
  uses-material-design: true
  generate: true
